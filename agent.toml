schema_version = 1

[agent]
framework = "langgraph"
server = "agentbricks"
deployment_name = "clinical-r-eikyyo"
default_model = "system.ai.gpt-6-1-sol"

[memory_store]
name = "clinical-research-agent-eikyyo-memory"

[session_store]
name = "clinical-research-agent-eikyyo-sessions"

[tracing]
experiment_name = "/Shared/agentbricks_traces/clinical-research-agent-eikyyo"

# Per-model request protocol. Unlisted models use Chat Completions.
[models."system.ai.gpt-6-astra"]
use_responses_api = true

[models."system.ai.gpt-6-1-sol"]
use_responses_api = true

[[tools]]
id = "web_search"
auth = "app"
source = {kind = "mcp", service = "system.ai.web_search"}
